<!DOCTYPE html>
<html>
<head>
<title>Treasure Hunt</title>
<style>
body{font-family:Arial;text-align:center;padding:40px;background:#111;color:white;}
input,button{padding:10px;margin:10px;}
#riddle{display:none;font-size:22px;color:yellow;margin-top:20px;}
</style>
</head>
<body>

<h1>Enter Secret Code</h1>
<input type="text" id="code" placeholder="Enter code" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button onclick="checkCode()">Submit</button>

<p id="msg"></p>
<div id="riddle"></div>

<script>
function checkCode(){
let code=document.getElementById("code").value.toUpperCase();
let riddle=document.getElementById("riddle");
let msg=document.getElementById("msg");

if(code==="MCA123"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Almost at the peak but not the end,Follow the path where MCA minds blend and where many seats unite";
}
else if(code==="H2OSPY"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Three H₂O points stand across the way,But only one spy waits there today.Watch carefully and choose the right side,Because the secret watcher does not hide";
}
else if(code==="FINAL999"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="The hunt is ending, the victory near,Return to the beginning — the treasure is here.";
}
else if(code==="EXAM777"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Where hall tickets matter more than sleep,And nervous footsteps slowly creep,Near the Examination Section, someone waits still —Guarding your next fossil thrill.";
}
else if(code==="REGISTER101"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Go where entries were marked before the race began, The clue awaits the smartest clan";
}
else if(code==="STAFF404"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Climb to the fourth floor, don’t stop midway,Where MCA students clear doubts each day.Near the room where staff members stay,Your next fossil clue is hidden away.";
}
else if(code==="LOCKER101"){
msg.innerHTML="✅ Correct!";
riddle.style.display="block";
riddle.innerHTML="Just below where the second path begins,A place where silent mobile storage wins.While classes run, the phones stay there,Your next fossil clue awaits with care.";
}
else{
msg.innerHTML="❌ Wrong Code!";
riddle.style.display="none";
}
}
</script>

</body>
</html>
